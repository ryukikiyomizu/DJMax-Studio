name: Stage Offline NuGet Cache for Dotnet10

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0d381-djmax-studio
    paths:
      - .github/workflows/stage-offline-nuget-cache-dotnet10.yml

permissions:
  contents: write

jobs:
  stage-offline-nuget-cache-dotnet10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0d381-djmax-studio

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prime offline cache for net8 builds under dotnet10
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/offline-nuget-dotnet10
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/offline-restore-dotnet10"
          rm -rf "$work" "$NUGET_PACKAGES"
          mkdir -p "$work/app" "$NUGET_PACKAGES"

          cat > "$work/app/test.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
            </PropertyGroup>
          </Project>
          EOF
          cat > "$work/app/Program.cs" <<'EOF'
          Console.WriteLine("ok");
          EOF

          dotnet restore "$work/app/test.csproj"
          du -sh "$NUGET_PACKAGES"
          find "$NUGET_PACKAGES" -maxdepth 2 -mindepth 2 -type d | sort

      - name: Package cache and commit chunks
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/offline-nuget-dotnet10
        run: |
          set -euo pipefail
          outdir="$GITHUB_WORKSPACE/tooling/offline-nuget-cache-dotnet10"
          rm -rf "$outdir"
          mkdir -p "$outdir"
          tar -C "$NUGET_PACKAGES" -cJf "$outdir/offline-nuget-cache-dotnet10.tar.xz" .
          sha256sum "$outdir/offline-nuget-cache-dotnet10.tar.xz" | tee "$outdir/offline-nuget-cache-dotnet10.tar.xz.sha256"
          split -b 48m -d -a 2 \
            "$outdir/offline-nuget-cache-dotnet10.tar.xz" \
            "$outdir/offline-nuget-cache-dotnet10.tar.xz.part-"
          rm "$outdir/offline-nuget-cache-dotnet10.tar.xz"
          {
            du -sh "$NUGET_PACKAGES"
            echo
            find "$NUGET_PACKAGES" -maxdepth 2 -mindepth 2 -type d | sort
            echo
            ls -lh "$outdir"
          } > "$outdir/manifest.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/offline-nuget-cache-dotnet10
          git commit -m "Stage offline NuGet cache for dotnet10 [skip ci]"
          git push origin HEAD:arena/01a0d381-djmax-studio

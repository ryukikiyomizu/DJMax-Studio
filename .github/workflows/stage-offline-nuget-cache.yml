name: Stage Offline NuGet Cache

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0d381-djmax-studio
    paths:
      - .github/workflows/stage-offline-nuget-cache.yml

permissions:
  contents: write

jobs:
  stage-offline-nuget-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0d381-djmax-studio

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prime offline NuGet package cache
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/offline-nuget
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/offline-restore"
          rm -rf "$work" "$NUGET_PACKAGES"
          mkdir -p "$work/net8-app" "$work/netstandard-lib" "$NUGET_PACKAGES"

          cat > "$work/net8-app/net8-app.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat > "$work/net8-app/Program.cs" <<'EOF'
          Console.WriteLine("ok");
          EOF

          cat > "$work/netstandard-lib/netstandard-lib.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
            </PropertyGroup>
          </Project>
          EOF
          cat > "$work/netstandard-lib/Class1.cs" <<'EOF'
          namespace OfflineSmoke;
          public static class Placeholder { }
          EOF

          dotnet restore "$work/net8-app/net8-app.csproj"
          dotnet restore "$work/netstandard-lib/netstandard-lib.csproj"
          dotnet restore DJMaxEditor.Studio/DJMaxEditor.Studio.csproj -p:EnableWindowsTargeting=true
          dotnet restore libs/UnpackMe.SDK.Standard/UnpackMe.SDK.Standard.csproj

          du -sh "$NUGET_PACKAGES"
          find "$NUGET_PACKAGES" -maxdepth 2 -mindepth 2 -type d | sort > "$RUNNER_TEMP/offline-package-list.txt"
          sed -n '1,200p' "$RUNNER_TEMP/offline-package-list.txt"

      - name: Package offline cache and commit chunks
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/offline-nuget
        run: |
          set -euo pipefail
          outdir="$GITHUB_WORKSPACE/tooling/offline-nuget-cache"
          rm -rf "$outdir"
          mkdir -p "$outdir"
          tar -C "$NUGET_PACKAGES" -cJf "$outdir/offline-nuget-cache.tar.xz" .
          sha256sum "$outdir/offline-nuget-cache.tar.xz" | tee "$outdir/offline-nuget-cache.tar.xz.sha256"
          split -b 48m -d -a 2 \
            "$outdir/offline-nuget-cache.tar.xz" \
            "$outdir/offline-nuget-cache.tar.xz.part-"
          rm "$outdir/offline-nuget-cache.tar.xz"
          {
            echo "NUGET_PACKAGES=$NUGET_PACKAGES"
            du -sh "$NUGET_PACKAGES"
            echo
            echo "Packages:"
            find "$NUGET_PACKAGES" -maxdepth 2 -mindepth 2 -type d | sort
            echo
            echo "Chunks:"
            ls -lh "$outdir"
          } > "$outdir/manifest.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/offline-nuget-cache
          git commit -m "Stage offline NuGet cache [skip ci]"
          git push origin HEAD:arena/01a0d381-djmax-studio

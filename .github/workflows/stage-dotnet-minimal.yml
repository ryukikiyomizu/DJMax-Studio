name: Stage Minimal .NET Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0d381-djmax-studio
    paths:
      - .github/workflows/stage-dotnet-minimal.yml

permissions:
  contents: write

jobs:
  stage-minimal-dotnet-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0d381-djmax-studio

      - name: Download and install .NET 8 SDK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          chmod +x "$RUNNER_TEMP/dotnet-install.sh"
          install_dir="$RUNNER_TEMP/dotnet"
          "$RUNNER_TEMP/dotnet-install.sh" --channel 8.0 --quality GA --install-dir "$install_dir"
          "$install_dir/dotnet" --info

      - name: Build minimal bundle and commit chunks
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/dotnet"
          sdk_version="$($install_dir/dotnet --list-sdks | awk '/^8\.0\./ {print $1}' | tail -n 1)"
          runtime_version="$($install_dir/dotnet --list-runtimes | awk '/^Microsoft.NETCore.App 8\./ {print $2}' | tail -n 1)"
          windows_ref_version="$(find "$install_dir/packs/Microsoft.WindowsDesktop.App.Ref" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          netcore_ref_version="$(find "$install_dir/packs/Microsoft.NETCore.App.Ref" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          netstandard_ref_version="$(find "$install_dir/packs/NETStandard.Library.Ref" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"

          stage="$RUNNER_TEMP/dotnet-minimal"
          rm -rf "$stage"
          mkdir -p "$stage"

          cp -a "$install_dir/dotnet" "$stage/"
          cp -a "$install_dir/host" "$stage/"
          mkdir -p "$stage/sdk" "$stage/shared/Microsoft.NETCore.App" "$stage/packs"
          cp -a "$install_dir/sdk/$sdk_version" "$stage/sdk/"
          cp -a "$install_dir/shared/Microsoft.NETCore.App/$runtime_version" "$stage/shared/Microsoft.NETCore.App/"
          cp -a "$install_dir/packs/Microsoft.NETCore.App.Ref" "$stage/packs/"
          cp -a "$install_dir/packs/NETStandard.Library.Ref" "$stage/packs/"
          cp -a "$install_dir/packs/Microsoft.WindowsDesktop.App.Ref" "$stage/packs/"
          if [ -d "$install_dir/sdk-manifests" ]; then
            cp -a "$install_dir/sdk-manifests" "$stage/"
          fi
          for file in LICENSE.txt ThirdPartyNotices.txt; do
            if [ -f "$install_dir/$file" ]; then
              cp -a "$install_dir/$file" "$stage/"
            fi
          done

          bundle_dir="$GITHUB_WORKSPACE/tooling/dotnet-bundle"
          rm -rf "$bundle_dir"
          mkdir -p "$bundle_dir"
          tar -C "$stage" -cJf "$bundle_dir/dotnet-minimal-8-linux-x64.tar.xz" .
          sha256sum "$bundle_dir/dotnet-minimal-8-linux-x64.tar.xz" | tee "$bundle_dir/dotnet-minimal-8-linux-x64.tar.xz.sha256"
          split -b 48m -d -a 2 \
            "$bundle_dir/dotnet-minimal-8-linux-x64.tar.xz" \
            "$bundle_dir/dotnet-minimal-8-linux-x64.tar.xz.part-"
          rm "$bundle_dir/dotnet-minimal-8-linux-x64.tar.xz"
          {
            echo "sdk=$sdk_version"
            echo "runtime=$runtime_version"
            echo "windowsDesktopRef=$windows_ref_version"
            echo "netcoreRef=$netcore_ref_version"
            echo "netstandardRef=$netstandard_ref_version"
            du -sh "$bundle_dir"
            ls -lh "$bundle_dir"
          } > "$bundle_dir/manifest.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/dotnet-bundle
          git commit -m "Stage minimal .NET bundle [skip ci]"
          git push origin HEAD:arena/01a0d381-djmax-studio

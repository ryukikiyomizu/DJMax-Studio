name: build

# The sandbox this work was written in has no .NET toolchain, so the first build
# happens here: a real Windows runner with the real WindowsDesktop targeting packs,
# which is the only platform this solution's WinForms/WPF surfaces build on cleanly.
#
# The sandbox's network is GitHub-allowlisted and cannot fetch Actions log archives,
# so on failure this workflow surfaces the errors two ways that survive the trip
# back: one ::error annotation per build error (readable from the check-runs API)
# and the full msbuild log committed to the ci-logs branch (readable via git).
on:
  push:
    branches-ignore: ['ci-logs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check XAML thickness literals
        # WPF compiles Margin/Padding/BorderThickness strings to BAML without
        # validating the token count, then ThicknessConverter throws at window
        # load: a three-value literal (e.g. "0,0,4") takes MainWindow down at
        # startup despite a green build. Thickness accepts 1, 2 or 4 values.
        shell: bash
        run: |
          set -e
          bad=$(grep -rnE '(Margin|Padding|BorderThickness)="[0-9.]+\s*,\s*[0-9.]+\s*,\s*[0-9.]+"' --include='*.xaml' . || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::XAML thickness must have 1, 2 or 4 values, never 3 (runtime XamlParseException)"
            exit 1
          fi
          echo "No malformed thickness literals."

      - name: Build (Debug)
        run: dotnet build DJMaxEditor.sln -c Debug --nologo -flp:"logfile=build-debug.log;verbosity=normal"

      - name: Build (Release)
        if: success()
        run: dotnet build DJMaxEditor.sln -c Release --nologo -flp:"logfile=build-release.log;verbosity=normal"

      - name: Publish Studio (win-x64, framework-dependent)
        if: success()
        run: >
          dotnet publish DJMaxEditor.Studio/DJMaxEditor.Studio.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/studio

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DJMaxStudio-win-x64
          path: publish/studio
          retention-days: 30

      - name: Emit build errors as annotations
        if: failure()
        shell: pwsh
        run: |
          Copy-Item build-*.log $env:RUNNER_TEMP -Force -ErrorAction SilentlyContinue
          $lines = Get-Content $env:RUNNER_TEMP\build-debug.log -ErrorAction SilentlyContinue |
            Where-Object { $_ -match ': (error|warning) [A-Z]+[0-9]+' }
          $i = 0
          foreach ($line in $lines) {
            $i++
            if ($i -gt 40) { Write-Output "::error::(more errors truncated - see ci-logs branch)"; break }
            $msg = $line
            if ($msg.Length -gt 1000) { $msg = $msg.Substring(0, 1000) }
            Write-Output "::error::$msg"
          }
          if ($i -eq 0) { Write-Output "::error::build failed but no error line was captured - see ci-logs branch" }

      - name: Save full build logs to ci-logs branch
        if: failure()
        shell: pwsh
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "bot@users.noreply.github.com"
          $branchExists = git ls-remote --heads origin ci-logs
          git checkout --orphan ci-log-tmp
          git rm -rf --quiet .
          if ($branchExists) {
            git fetch origin ci-logs
            git checkout ci-logs
            git branch -D ci-log-tmp
          }
          else {
            git branch -m ci-log-tmp ci-logs
          }
          Copy-Item $env:RUNNER_TEMP\build-*.log . -Force
          git add build-*.log
          git commit -m "ci logs for $($env:GITHUB_SHA.Substring(0,8)) [skip ci]"
          git push origin ci-logs

  # The BMS/bmson import path is plain C# with no Windows surface, so it can be
  # exercised end to end here: parse a classic chart that carries deliberately
  # corrupt lines (per-line tolerance), then round-trip it through the bmson
  # writer and the new bmson reader. The project is generated in the workflow,
  # not committed - the repo grows no test harness for it.
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate smoke-test project
        shell: bash
        run: |
          mkdir -p smoke
          cat > smoke/smoke.csproj <<'SMOKE_CSPROJ_EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>disable</Nullable>
              <LangVersion>12</LangVersion>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\DJMaxEditor.Core\DJMaxEditor.Core.csproj" />
              <Compile Include="..\Shared\Files\bms\BmsChartSerializer.cs" />
              <Compile Include="..\Shared\Files\bms\BmsonChartSerializer.cs" />
              <Compile Include="..\Shared\Files\bms\BmsonChartParser.cs" />
              <Compile Include="..\Shared\Files\tech\TechmaniaChartSerializer.cs" />
              <Compile Include="..\Shared\Files\tech\TechmaniaChartWriter.cs" />
              <Compile Include="..\Shared\Controls\TimelineV2\TechnikaNoteClassifier.cs" />
              <Compile Include="..\Shared\Preview\GameplayPreviewProjector.cs" />
              <Compile Include="..\Shared\Preview\RespectGameplayLayout.cs" />
              <Compile Include="..\Shared\Files\ChartLoadException.cs" />
              <Compile Include="..\Shared\Files\FormatDetection\ChartFormatDetector.cs" />
              <Compile Include="..\Shared\Files\FormatDetection\FormatDetectionResult.cs" />
              <Compile Include="..\Shared\Logs.cs" />
              <Compile Include="..\Shared\Diagnostics\DiagnosticLog.cs" />
            </ItemGroup>
          </Project>
          SMOKE_CSPROJ_EOF
          cat > smoke/Program.cs <<'SMOKE_PROG_EOF'
          using System;
          using System.IO;
          using System.Linq;
          using System.Text;
          using System.Text.Json.Nodes;
          using DJMaxEditor.DJMax;
          using DJMaxEditor.Files;
          using DJMaxEditor.Files.bms;
          using DJMaxEditor.Files.Tech;
          using DJMaxEditor.Files.FormatDetection;
          using DJMaxEditor.Preview;
          int checks = 0;
          void Check(bool condition, string what)
          {
              checks++;
              if (!condition) throw new InvalidOperationException("assert failed: " + what);
              Console.WriteLine("ok: " + what);
          }
          // A classic chart with three deliberately corrupt lines: a non-numeric measure
          // ratio, an object payload with a slot that is not base-36, and an odd-length
          // payload. The parser must skip each line and keep the chart around it.
          var bms = new StringBuilder();
          bms.AppendLine("*---------- smoke");
          bms.AppendLine("#TITLE Smoke");
          bms.AppendLine("#ARTIST Tester");
          bms.AppendLine("#BPM 120");
          bms.AppendLine("#WAV01 smoke.wav");
          bms.AppendLine("#00011:01010000");   // lane 1, measure 0: notes at slots 0 and 1 (object id 01)
          bms.AppendLine("#00051:01010000");   // lane 1 long note from slot 0 to slot 1
          bms.AppendLine("#00202:abc");        // corrupt: measure ratio
          bms.AppendLine("#00201:0.0.0.0");    // corrupt: not base-36
          bms.AppendLine("#00311:010");        // corrupt: odd length
          File.WriteAllText("smoke.bms", bms.ToString(), new UTF8Encoding(false));
          PlayerData player;
          try
          {
              player = BmsChartSerializer.Parse(File.ReadAllText("smoke.bms"));
          }
          catch (Exception ex)
          {
              Console.WriteLine("FAIL: corrupt lines aborted the parse: " + ex.Message);
              return 1;
          }
          Check(player != null, "parse produced a model");
          Check(player.SourceFormat == ChartFormat.BmsClassic, "source format stamped BmsClassic");
          Check(Math.Abs(player.Tempo - 120f) < 0.001f, "initial tempo 120");
          var lane = player.Tracks.GetTrackAtIndex(0);
          Check(lane != null && lane.TrackName == "BMS Lane 11", "lane 11 track created");
          // A four-slot measure is 1152/4 = 288 virtual ticks per slot, and EventData stamps
          // every fresh note with a default 36-virtual-tick body (Duration 6), which the
          // classic reader leaves alone for normal notes.
          var normal = lane.Events.Where(x => x.EventType == EventType.Note && x.VirtualDuration == 36).ToList();
          var longs = lane.Events.Where(x => x.VirtualDuration > 36).ToList();
          Check(normal.Count == 2, "two normal notes survived, got " + normal.Count);
          Check(normal.Any(x => x.VirtualTick == 0) && normal.Any(x => x.VirtualTick == 288),
                "normal notes at slots 0 and 1 (ticks 0 and 288)");
          Check(longs.Count == 1 && longs[0].VirtualTick == 0 && longs[0].VirtualDuration == 288,
                "long note 0..288 reconstructed from the 51 channel");
          Check(lane.Events.All(x => x.Instrument != null && x.Instrument.Name == "smoke.wav"),
                "notes point at the smoke.wav instrument");
          // bmson round trip: the same model written as bmson, read back by the new parser.
          string bmson = BmsonChartSerializer.Serialize(player);
          File.WriteAllText("smoke.bmson", bmson, new UTF8Encoding(false));
          Check(bmson.Contains("\"sound_channels\""), "writer emitted sound_channels");
          byte[] bytes = File.ReadAllBytes("smoke.bmson");
          var round = BmsonChartSerializer.Parse(bytes);
          Check(round != null && round.SourceFormat == ChartFormat.Bmson, "bmson parse stamped Bmson");
          Check(Math.Abs(round.Tempo - 120f) < 0.001f, "bmson init_bpm 120");
          Check(round.Tracks.Count >= 1, "bmson produced tracks");
          var lane1 = round.Tracks.GetTrackAtIndex(0);
          Check(lane1.TrackName == "bmson Lane 1", "bmson lane 1 became bmson Lane 1");
          var ticks = lane1.Events.Select(x => x.VirtualTick).OrderBy(x => x).ToList();
          Check(ticks.Contains(0) && ticks.Contains(288), "bmson notes land on ticks 0 and 288");
          Check(lane1.Events.Count(x => x.VirtualDuration == 288) == 1,
                "bmson long note duration survives (288 virtual ticks)");
          Check(lane1.Events.Count(x => x.VirtualDuration == 36) == 2,
                "bmson normal notes keep the default body the classic reader gives");
          Check(round.Instruments.Any(x => x.Name == "smoke.wav"), "keysound name survives by filename");
          // Detection: the bmson bytes classify as bmson, and the classic text as BmsClassic.
          var detected = ChartFormatDetector.Detect(bytes, ".bmson");
          Check(detected.Format == ChartFormat.Bmson && detected.IsOpenable, "detector identifies bmson");
          var detectedBms = ChartFormatDetector.Detect(Encoding.UTF8.GetBytes(bms.ToString()), ".bms");
          Check(detectedBms.Format == ChartFormat.BmsClassic && detectedBms.IsOpenable,
                "detector still identifies classic BMS");

          // TECHMANIA track.tech (format v3): every note family, extended fields, a drag
          // with node-derived duration, a tempo event and an end-of-scan marker.
          string tech = @"{
            ""version"": ""3"",
            ""trackMetadata"": { ""guid"":""t"", ""title"":""T"", ""artist"":""A"", ""genre"":""G"",
              ""additionalCredits"":""thx"", ""eyecatchImage"":""eye.png"",
              ""previewTrack"":""prev.ogg"", ""previewStartTime"":1.5, ""previewEndTime"":4,
              ""previewBga"":""prev.mp4"", ""autoOrderPatterns"":true },
            ""patterns"": [ {
              ""patternMetadata"": { ""guid"":""p"", ""patternName"":""NM"", ""level"":7,
                ""controlScheme"":1, ""playableLanes"":4, ""author"":""mapper"",
                ""backingTrack"":""audio.ogg"", ""backImage"":""bg.png"", ""bga"":""bga.mp4"",
                ""bgaOffset"":0.25, ""waitForEndOfBga"":true, ""playBgaOnLoop"":true,
                ""firstBeatOffset"":-0.5, ""initBpm"":128, ""bps"":2 },
              ""bpmEvents"": [ { ""pulse"": 960, ""bpm"": 140 } ],
              ""timeStops"": [ { ""pulse"": 480, ""duration"": 120 } ],
              ""packedNotes"": [
                ""Basic|0|0|"",
                ""ChainHead|240|0|a.ogg"",
                ""ChainNode|480|0|a.ogg"",
                ""ChainNode|720|0|a.ogg"",
                ""RepeatHead|240|1|b.ogg"",
                ""Repeat|480|1|b.ogg"",
                ""Repeat|720|1|b.ogg"",
                ""E|Basic|960|2|80|-50|0|c|d.ogg"",
                ""E|Basic|1920|0|100|0|1|""
              ],
              ""packedHoldNotes"": [
                ""Hold|1200|0|480|h.ogg"",
                ""E|RepeatHeadHold|1200|1|600|100|0|0|rh.ogg"",
                ""RepeatHold|1800|1|300|""
              ],
              ""packedDragNotes"": [
                { ""packedNote"": ""Drag|2160|3|d.ogg"",
                  ""packedNodes"": [ ""0|0|0|0|120|0.25"", ""480|0|-120|-0.25|0|0"" ] },
                { ""packedNote"": ""E|Drag|2640|3|100|0|1|d2.ogg"",
                  ""packedNodes"": [ ""0|0|0|0|0|0"", ""120|-0.5|0|0|0|0"", ""360|0|0|0|0|0"" ] }
              ]
            }]
          }";
          var detectedTech = ChartFormatDetector.Detect(Encoding.UTF8.GetBytes(tech), ".tech");
          Check(detectedTech.Format == ChartFormat.TechmaniaTrack && detectedTech.IsOpenable,
                "detector identifies a TECHMANIA track");
          PlayerData techChart = TechmaniaChartSerializer.Parse(Encoding.UTF8.GetBytes(tech));
          Check(techChart.SourceFormat == ChartFormat.TechmaniaTrack, "import stamps TechmaniaTrack");
          Check(Math.Abs(techChart.Tempo - 128f) < 0.01f, "initBpm becomes chart tempo");
          // Container metadata is retained for the save-back round trip.
          var techMeta = techChart.TechMetadata;
          Check(techMeta != null && techMeta.Title == "T" && techMeta.Artist == "A"
                && techMeta.Genre == "G", "track metadata is retained");
          Check(techMeta.PatternName == "NM" && techMeta.Level == 7
                && techMeta.ControlScheme == 1 && techMeta.Author == "mapper",
                "pattern metadata is retained");
          Check(techMeta.BackingTrack == "audio.ogg" && techMeta.Bga == "bga.mp4"
                && Math.Abs(techMeta.FirstBeatOffset - -0.5) < 0.001,
                "AV and offset metadata is retained");
          Check(techMeta.Bps == 2, "beats-per-scan is retained, got " + techMeta.Bps);
          Check(techMeta.TimeStops.Count == 1 && techMeta.TimeStops[0].Pulse == 480
                && techMeta.TimeStops[0].Duration == 120, "time stop is retained");
          // The declared bps drives the TECHNIKA projection rather than a fixed four.
          var techProjection = GameplayPreviewProjector.Project(
              techChart, GameplayPreviewProfile.Technika);
          Check(techProjection.BeatsPerScan == 2,
                "projection honors the .tech beats-per-scan");
          Check(techChart.Tracks.Count == 9, "four lane, four marker and one tempo track, got "
                + techChart.Tracks.Count);
          var t0 = techChart.Tracks.GetTrackAtIndex(0).Events.ToList();
          // Five authored notes plus the end-of-scan flagged basic, which is both a real
          // lane-0 note and the trigger for a marker on track 4.
          Check(t0.Count == 6, "lane 0 holds 6 notes, got " + t0.Count);
          Check(t0[0].Attribute == 0 && t0[0].Tick == 0, "basic sits at pulse 0");
          Check(t0[1].Attribute == 5 && t0[1].Tick == 48, "chain head lands at tick 48");
          Check(t0[2].Attribute == 6 && t0[3].Attribute == 6, "chain nodes keep attribute 6");
          Check(t0[4].Attribute == 12 && t0[4].Tick == 240 && t0[4].Duration == 96,
                "hold lands at tick 240 with a 2-beat (96 tick) body");
          Check(t0[5].Attribute == 0 && t0[5].Tick == 384,
                "end-of-scan flagged note stays a real note on its lane");
          var t1 = techChart.Tracks.GetTrackAtIndex(1).Events.ToList();
          Check(t1[0].Attribute == 10 && t1[1].Attribute == 11 && t1[2].Attribute == 11,
                "repeat head then attribute-11 ticks");
          Check(t1[3].Attribute == 10 && t1[3].Duration == 120, "repeat head hold duration");
          Check(t1[4].Attribute == 11 && t1[4].Duration == 60, "repeat hold duration");
          var t2 = techChart.Tracks.GetTrackAtIndex(2).Events.ToList();
          Check(t2.Count == 1 && t2[0].Volume == 80, "extended volume survives");
          Check(t2[0].Pan == 32 && t2[0].Instrument.Name == "c|d.ogg",
                "extended pan maps to the 0..127 byte and the keysound keeps its pipe");
          var t3 = techChart.Tracks.GetTrackAtIndex(3).Events.ToList();
          Check(t3.Count == 2 && t3[0].Attribute == 0 && t3[0].Tick == 432
                && t3[0].Duration == 96, "drag is attribute 0 with node-derived duration");
          Check(t3[1].Attribute == 0 && t3[1].Tick == 528 && t3[1].Duration == 64
                && t3[1].Instrument.Name == "d2.ogg",
                "extended B-spline drag keeps head, keysound and interpolated duration");
          var eos = techChart.Tracks.GetTrackAtIndex(4).Events.ToList();
          Check(eos.Count == 1 && eos[0].Attribute == 100 && eos[0].Tick == 384,
                "end-of-scan flag becomes an attribute-100 marker on track 4");
          var tm = techChart.Tracks.GetTrackAtIndex(8).Events.ToList();
          Check(tm.Count == 1 && tm[0].EventType == EventType.Tempo
                && Math.Abs(tm[0].Tempo - 140f) < 0.01f, "BPM event lands on the tempo track");
          Check(techChart.Instruments.Count(i => i.Name == "a.ogg") == 1,
                "a repeated keysound filename shares one instrument");
          Check(techChart.Tracks.GetTrackAtIndex(5).Events.Count() == 0,
                "an empty marker lane still has its track");
          bool oldRejected = false;
          try { TechmaniaChartSerializer.Parse(Encoding.UTF8.GetBytes("{ \"version\": \"2\", \"patterns\": [] }")); }
          catch (ChartLoadException ex) { oldRejected = ex.Kind == ChartLoadError.UnsupportedFormat; }
          Check(oldRejected, "format v2 is rejected with UnsupportedFormat");

          // Round trip: write the imported chart back out and import the result again.
          string techOut = TechmaniaChartSerializer.Serialize(techChart);
          var detectedRound = ChartFormatDetector.Detect(Encoding.UTF8.GetBytes(techOut), ".tech");
          Check(detectedRound.Format == ChartFormat.TechmaniaTrack,
                "the re-serialized file still detects as TECHMANIA");
          Check(techOut.Contains("\"version\": \"3\""), "written file declares format v3");
          Check(techOut.Contains("Basic|0|0|"), "a compact basic is packed without extended fields");
          Check(techOut.Contains("E|Basic|1920|0|100|0|1|"),
                "the end-of-scan note is packed extended with the flag");
          Check(techOut.Contains("E|Basic|960|2|80|-50|0|c|d.ogg"),
                "extended volume/pan and the pipe-bearing keysound survive packing");
          Check(techOut.Contains("Hold|1200|0|480|h.ogg") &&
                techOut.Contains("RepeatHold|1800|1|300|"),
                "holds keep their pulse durations");
          Check(techOut.Contains("\"packedDragNotes\""), "drags land in the drag table");
          // Untouched drags keep their authored shape verbatim: the bezier drag's
          // off-line control points ...
          Check(techOut.Contains("120|0.25") && techOut.Contains("-120|-0.25"),
                "an untouched bezier drag keeps its control points");
          // ... its lane-crossing B-spline sibling's curve-type head and anchors ...
          Check(techOut.Contains("E|Drag|2640|3|100|0|1|d2.ogg")
                && techOut.Contains("120|-0.5|0|0|0|0"),
                "an untouched B-spline drag keeps its curve type and anchors");
          // ... while a freshly authored (no retained raw json) drag is rebuilt straight.
          var blankDrag = new PlayerData();
          var dt = new TrackData(0) { TrackName = "lane 1" };
          dt.AddEvent(new EventData { EventType = EventType.Note, VirtualTick = 0,
              VirtualDuration = 288 });
          blankDrag.Tracks.AddTrack(dt);
          string blankDragOut = TechmaniaChartSerializer.Serialize(blankDrag);
          Check(blankDragOut.Contains("\"packedNote\": \"Drag|0|0|\"")
                && blankDragOut.Contains("120|0") && blankDragOut.Contains("240|0|-120|0|0|0"),
                "a newly authored drag is built as a straight 240-pulse drag");
          PlayerData roundTech = TechmaniaChartSerializer.Parse(Encoding.UTF8.GetBytes(techOut));
          Check(roundTech.Tracks.Count == 9, "round trip keeps four lane, four marker, tempo tracks");
          Check(roundTech.Tracks.GetTrackAtIndex(0).Events.Count() == 6,
                "lane 0 note count survives the round trip");
          var rt1 = roundTech.Tracks.GetTrackAtIndex(1).Events.ToList();
          Check(rt1[3].Attribute == 10 && rt1[3].Duration == 120 &&
                rt1[4].Attribute == 11 && rt1[4].Duration == 60,
                "repeat hold timings survive the round trip");
          var rt3 = roundTech.Tracks.GetTrackAtIndex(3).Events.ToList();
          Check(rt3.Count == 2 && rt3[0].Tick == 432 && rt3[0].Duration == 96,
                "bezier drag timing survives the round trip");
          // Extended B-spline drag: field 6 of E|Drag is the curve type, never an
          // end-of-scan flag; the 3-node B-spline length is (p[n-2] + 5*p[n-1]) / 6
          // = (120 + 5*360) / 6 = 320 pulses.
          Check(rt3[1].Tick == 528 && rt3[1].Duration == 64,
                "B-spline drag head and interpolated duration survive");
          int markerTotal = 0;
          for (int mk = 4; mk <= 7; mk++)
              markerTotal += roundTech.Tracks.GetTrackAtIndex((uint)mk).Events.Count();
          Check(markerTotal == 1,
                "a B-spline drag's curve type never becomes an end-of-scan marker");
          var rtEos = roundTech.Tracks.GetTrackAtIndex(4).Events.ToList();
          Check(rtEos.Count == 1 && rtEos[0].Attribute == 100 && rtEos[0].Tick == 384,
                "end-of-scan marker survives the round trip");
          var rtTempo = roundTech.Tracks.GetTrackAtIndex(8).Events.ToList();
          Check(rtTempo.Count == 1 && Math.Abs(rtTempo[0].Tempo - 140f) < 0.01f,
                "tempo event survives the round trip");
          // Container metadata survives the write-back.
          Check(techOut.Contains("\"guid\": \"t\"") && techOut.Contains("\"guid\": \"p\""),
                "track and pattern GUIDs are written back");
          Check(techOut.Contains("\"bps\": 2"), "beats-per-scan is written back");
          Check(techOut.Contains("\"controlScheme\": 1") && techOut.Contains("\"level\": 7"),
                "pattern metadata is written back");
          Check(techOut.Contains("\"pulse\": 480") && techOut.Contains("\"duration\": 120"),
                "time stops are written back");
          var roundMeta = roundTech.TechMetadata;
          Check(roundMeta != null && roundMeta.Title == "T" && roundMeta.PatternName == "NM"
                && roundMeta.Bps == 2 && roundMeta.TimeStops.Count == 1,
                "metadata survives the full round trip");
          Check(techOut.IndexOf("ChainHead", StringComparison.Ordinal) >= 0 &&
                techOut.IndexOf("ChainNode", StringComparison.Ordinal) >= 0,
                "chain members are packed by name");
          // Freshly authored notes use the model defaults (volume 127 / pan 64), which must
          // come out as TECHMANIA defaults in the compact form.
          var blank = new PlayerData();
          var t = new TrackData(0) { TrackName = "lane 1" };
          t.AddEvent(new EventData { EventType = EventType.Note, VirtualTick = 0 });
          blank.Tracks.AddTrack(t);
          string blankOut = TechmaniaChartSerializer.Serialize(blank);
          Check(blankOut.Contains("Basic|0|0|") && !blankOut.Contains("E|Basic"),
                "model-default volume/pan pack as a compact note");

          // Multi-difficulty container: stitch a second, untouched pattern (MX) behind
          // the opened one (NM). The editor edits slot 0; slot 1 must come back verbatim.
          var multiDoc = JsonNode.Parse(tech);
          multiDoc["patterns"].AsArray().Add(JsonNode.Parse(
              "{\"patternMetadata\":{\"guid\":\"p2\",\"patternName\":\"MX\",\"author\":\"other\","
              + "\"initBpm\":100,\"bps\":4},\"packedNotes\":[\"Basic|0|1|mx.ogg\"],"
              + "\"packedHoldNotes\":[],\"packedDragNotes\":[]}"));
          string multiTech = multiDoc.ToJsonString();
          PlayerData multiChart = TechmaniaChartSerializer.Parse(
              Encoding.UTF8.GetBytes(multiTech));
          var mm = multiChart.TechMetadata;
          Check(mm.ActivePatternIndex == 0 && mm.SiblingPatterns.Count == 1
                && mm.SiblingPatterns[0].Index == 1,
                "only the first pattern opens; the other is retained as a sibling");
          string multiOut = TechmaniaChartSerializer.Serialize(multiChart);
          Check(multiOut.Contains("\"patternName\": \"MX\"") &&
                multiOut.Contains("Basic|0|1|mx.ogg"),
                "the unedited sibling difficulty is written back verbatim");
          PlayerData multiRound = TechmaniaChartSerializer.Parse(
              Encoding.UTF8.GetBytes(multiOut));
          Check(multiRound.TechMetadata.SiblingPatterns.Count == 1
                && multiRound.TechMetadata.SiblingPatterns[0].Json.Contains("mx.ogg"),
                "sibling difficulty survives a second round trip");

          // Asking for pattern slot 1 opens MX instead, and slot 0 becomes the sibling.
          PlayerData multiMx = TechmaniaChartSerializer.Parse(
              Encoding.UTF8.GetBytes(multiTech), 1);
          var mmm = multiMx.TechMetadata;
          Check(mmm.ActivePatternIndex == 1 && mmm.PatternName == "MX"
                && mmm.SiblingPatterns.Count == 1 && mmm.SiblingPatterns[0].Index == 0,
                "requesting pattern index 1 opens the MX difficulty");
          string mxOut = TechmaniaChartSerializer.Serialize(multiMx);
          Check(mxOut.Contains("\"patternName\": \"MX\"")
                && mxOut.Contains("\"patternName\": \"NM\"")
                && mxOut.Contains("Basic|0|1|mx.ogg"),
                "editing a chosen difficulty slot keeps both difficulties in order");

          var listing = TechmaniaChartSerializer.ListPatterns(
              Encoding.UTF8.GetBytes(multiTech));
          Check(listing.Count == 2 && listing[0].Name == "NM"
                && listing[1].Name == "MX" && listing[1].Index == 1,
                "pattern enumerator lists every difficulty with its slot");

          // Real shipped charts: a 3-lane single-pattern file and a two-difficulty
          // container, both with null metadata, fingerprints and legacy overrides.
          byte[] realBytes = File.ReadAllBytes(Path.Combine("smoke", "umapyoi.tech"));
          PlayerData real = TechmaniaChartSerializer.Parse(realBytes);
          var rm = real.TechMetadata;
          Check(rm != null && rm.Title == "umapyoi" && rm.PlayableLanes == 3
                && rm.PatternName == "NM", "real 3-lane chart opens with its metadata");
          Check(rm.Bga == "umapyoiprebga.mp4" && rm.WaitForEndOfBga
                && rm.SiblingPatterns.Count == 0,
                "real chart AV metadata is retained with no sibling patterns");
          Check(real.Tracks.GetTrackAtIndex(3).Events.Count() == 1,
                "real chart keeps the lane-3 preview note");
          string realOut = TechmaniaChartSerializer.Serialize(real);
          Check(realOut.Contains("legacyRulesetOverride")
                && realOut.Contains("legacySetlistOverride"),
                "legacy overrides ride through on the edited pattern");
          Check(!realOut.Contains("fingerprint"),
                "the stale fingerprint is dropped so the game recomputes it");
          Check(realOut.Contains("umapyoiprebgm.ogg")
                && realOut.Contains("\"playableLanes\": 3"),
                "keysound reference and 3-lane setup survive the real round trip");
          // The real chart's drag ends one lane over (anchor "240|1"); it must not be
          // rebuilt as a vertical drag when the note is untouched.
          Check(realOut.Contains("240|1|0|0|0|0"),
                "a lane-crossing drag anchor rides through verbatim");
          PlayerData realRound = TechmaniaChartSerializer.Parse(
              Encoding.UTF8.GetBytes(realOut));
          Check(realRound.TechMetadata.PlayableLanes == 3
                && realRound.TechMetadata.PatternName == "NM",
                "real chart reopens at 3 lanes after save-back");

          byte[] twoBytes = File.ReadAllBytes(
              Path.Combine("smoke", "crimes-two-patterns.tech"));
          PlayerData two = TechmaniaChartSerializer.Parse(twoBytes);
          Check(two.TechMetadata.SiblingPatterns.Count == 1
                && two.TechMetadata.PatternName == "MX",
                "real two-difficulty file opens MX and keeps New pattern as a sibling");
          string twoOut = TechmaniaChartSerializer.Serialize(two);
          Check(twoOut.Contains("\"patternName\": \"New pattern\"")
                && twoOut.Contains("800x800cc.jpg"),
                "real second difficulty and eyecatch reference are written back");
          PlayerData twoRound = TechmaniaChartSerializer.Parse(
              Encoding.UTF8.GetBytes(twoOut));
          Check(twoRound.TechMetadata.SiblingPatterns.Count == 1
                && twoRound.TechMetadata.SiblingPatterns[0].Json.Contains(
                    "\"patternName\": \"New pattern\""),
                "real two-difficulty file survives a second round trip");

          Console.WriteLine("SMOKE PASS (" + checks + " checks)");
          return 0;
          SMOKE_PROG_EOF
          # Real-world charts shipped with the repo: a 3-lane single-pattern file and a
          # two-difficulty container, both with null metadata, fingerprints and overrides.
          cp test-fixtures/tech/*.tech smoke/
          ls -la smoke/
      - name: Run smoke test
        shell: pwsh
        run: |
          $out = dotnet run --project smoke -c Debug 2>&1
          $out | Tee-Object -FilePath smoke-run.log | ForEach-Object { Write-Host $_ }
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The exception trace lands on stderr and PowerShell merges it ahead of
            # the buffered stdout, so a plain tail hides it; grep it out explicitly.
            Select-String -Path smoke-run.log -Pattern 'assert failed|Exception|error [A-Z]+[0-9]+' |
              Select-Object -First 20 |
              ForEach-Object { Write-Output ("::error::" + $_.Line) }
            exit $code
          }

name: Fetch .NET SDK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0d381-djmax-studio
    paths:
      - .github/workflows/fetch-dotnet-sdk.yml

jobs:
  fetch-dotnet-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Download .NET install script
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          chmod +x "$RUNNER_TEMP/dotnet-install.sh"

      - name: Install .NET 8 SDK into isolated folder
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/dotnet"
          rm -rf "$install_dir"
          "$RUNNER_TEMP/dotnet-install.sh" --channel 8.0 --quality GA --install-dir "$install_dir"
          "$install_dir/dotnet" --info
          "$install_dir/dotnet" --list-sdks
          "$install_dir/dotnet" --list-runtimes

      - name: Package downloaded SDK
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/dotnet"
          mkdir -p dotnet-sdk-artifact
          tar -C "$install_dir" -cf dotnet-sdk-artifact/dotnet-sdk-8-linux-x64.tar .
          sha256sum dotnet-sdk-artifact/dotnet-sdk-8-linux-x64.tar | tee dotnet-sdk-artifact/dotnet-sdk-8-linux-x64.tar.sha256
          split -b 95m -d -a 2 \
            dotnet-sdk-artifact/dotnet-sdk-8-linux-x64.tar \
            dotnet-sdk-artifact/dotnet-sdk-8-linux-x64.tar.part-
          ls -lh dotnet-sdk-artifact

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-8-linux-x64-split
          path: dotnet-sdk-artifact/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

name: Stage Release Dotnet SDK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0d381-djmax-studio
    paths:
      - .github/workflows/stage-release-dotnet.yml

permissions:
  contents: write

jobs:
  stage-release-dotnet-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0d381-djmax-studio

      - name: Download release SDK asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-dotnet"
          gh release download test_0.1 \
            --repo ryukikiyomizu/DJMax-Studio \
            --pattern 'dotnet-sdk-10.0.401-linux-x64.tar.gz' \
            --dir "$RUNNER_TEMP/release-dotnet"
          ls -lh "$RUNNER_TEMP/release-dotnet"

      - name: Split asset and commit chunks
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/release-dotnet/dotnet-sdk-10.0.401-linux-x64.tar.gz"
          outdir="$GITHUB_WORKSPACE/tooling/release-dotnet-sdk"
          rm -rf "$outdir"
          mkdir -p "$outdir"
          sha256sum "$src" | tee "$outdir/dotnet-sdk-10.0.401-linux-x64.tar.gz.sha256"
          split -b 48m -d -a 2 \
            "$src" \
            "$outdir/dotnet-sdk-10.0.401-linux-x64.tar.gz.part-"
          {
            ls -lh "$RUNNER_TEMP/release-dotnet"
            echo
            ls -lh "$outdir"
          } > "$outdir/manifest.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/release-dotnet-sdk
          git commit -m "Stage release dotnet SDK [skip ci]"
          git push origin HEAD:arena/01a0d381-djmax-studio
